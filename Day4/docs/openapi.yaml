openapi: 3.2.1

info:
  title: Support Ticket API
  description: API for authentication, ticket management, user administration, and service health.
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: Health
    description: Service health
  - name: Authentication
    description: User registration and authentication
  - name: Tickets
    description: Ticket management
  - name: Users
    description: User administration

paths:

  /health:
    get:
      tags:
        - Health
      summary: Check API and database health
      responses:
        "200":
          description: API and database are healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Database is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid request or email already registered

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login and receive an access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Email and password are required
        "401":
          description: Invalid credentials

  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get the authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Authentication required
        "404":
          description: User not found

  /tickets:
    get:
      tags:
        - Tickets
      summary: Get tickets visible to the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            minimum: 1

        - name: pageSize
          in: query
          description: Number of tickets per page
          schema:
            type: integer
            minimum: 1
            maximum: 50

        - name: status
          in: query
          description: Filter by ticket status
          schema:
            type: string
            enum:
              - open
              - in-progress
              - resolved

        - name: priority
          in: query
          description: Filter by ticket priority
          schema:
            type: string
            enum:
              - low
              - medium
              - high

        - name: assigneeId
          in: query
          description: Filter by assignee ID
          schema:
            type: integer
            minimum: 1

        - name: search
          in: query
          description: Search tickets
          schema:
            type: string

        - name: sortField
          in: query
          description: Field used for sorting
          schema:
            type: string
            enum:
              - id
              - title
              - priority
              - status
              - assignee
              - createdAt

        - name: sortDirection
          in: query
          description: Sort direction
          schema:
            type: string
            enum:
              - asc
              - desc

      responses:
        "200":
          description: Tickets returned successfully
        "400":
          description: Invalid query parameters
        "401":
          description: Authentication required

    post:
      tags:
        - Tickets
      summary: Create a ticket
      description: Customers and administrators can create tickets. The customer ID is taken from the authenticated user.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTicketRequest"
      responses:
        "201":
          description: Ticket created successfully
        "400":
          description: Invalid ticket data
        "401":
          description: Authentication required
        "403":
          description: User is not allowed to create tickets

  /tickets/{id}:
    get:
      tags:
        - Tickets
      summary: Get a ticket by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: Ticket returned successfully
        "400":
          description: Invalid ticket ID
        "401":
          description: Authentication required
        "403":
          description: User is not allowed to access this ticket
        "404":
          description: Ticket not found

    delete:
      tags:
        - Tickets
      summary: Delete a ticket
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: Ticket deleted successfully
        "400":
          description: Invalid ticket ID
        "401":
          description: Authentication required
        "403":
          description: User is not allowed to delete this ticket
        "404":
          description: Ticket not found

  /tickets/{id}/update:
    patch:
      tags:
        - Tickets
      summary: Update a ticket
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTicketRequest"
      responses:
        "200":
          description: Ticket updated successfully
        "400":
          description: Invalid ticket ID
        "401":
          description: Authentication required
        "403":
          description: User is not allowed to update this ticket
        "404":
          description: Ticket not found

  /users:
    get:
      tags:
        - Users
      summary: Get all users
      description: Administrator-only endpoint.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Users returned successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          description: Authentication required
        "403":
          description: Administrator access required

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TicketId:
      name: id
      in: path
      required: true
      description: Ticket ID
      schema:
        type: integer
        minimum: 1

  schemas:

    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: john@example.com
        password:
          type: string
          format: password
          example: secure-password

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: john@example.com
        password:
          type: string
          format: password
          example: secure-password

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
            - ADMIN
            - AGENT
            - CUSTOMER
        createdAt:
          type: string

    CreateTicketRequest:
      type: object
      required:
        - title
        - description
        - priority
      properties:
        title:
          type: string
          maxLength: 200
          example: Unable to login
        description:
          type: string
          maxLength: 5000
          example: I cannot log into my account.
        priority:
          type: string
          enum:
            - low
            - medium
            - high
          example: medium

    UpdateTicketRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        priority:
          type: string
          enum:
            - low
            - medium
            - high
        status:
          type: string
          enum:
            - open
            - in-progress
            - resolved
        assigneeId:
          type: integer
          minimum: 1

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        database:
          type: string
          example: ok